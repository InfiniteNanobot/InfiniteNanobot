name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Developer overview
        uses: lowlighter/metrics@latest
        with:
          filename: output/developer-metrics.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: output/isocalendar.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Pinned repositories
        uses: lowlighter/metrics@latest
        with:
          filename: output/repositories.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_repositories: yes
          plugin_repositories_pinned: 6

      - name: Recently starred repositories
        uses: lowlighter/metrics@latest
        with:
          filename: output/stars.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_stars: yes
          plugin_stars_limit: 6

      - name: Lines of code changed
        uses: lowlighter/metrics@latest
        with:
          filename: output/lines.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1

      - name: Repository licenses
        uses: lowlighter/metrics@latest
        with:
          filename: output/licenses.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          template: repository
          repo: InfiniteNanobot/InfiniteNanobot
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_licenses: yes
          plugin_licenses_legal: no
          plugin_licenses_ratio: yes
