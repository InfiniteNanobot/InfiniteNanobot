name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Developer overview
        uses: lowlighter/metrics@latest
        with:
          filename: output/developer-metrics.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 2%
          plugin_languages_other: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_days: 30

      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: output/isocalendar.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: GitHub Skyline
        uses: lowlighter/metrics@latest
        with:
          filename: output/skyline.svg
          token: NOT_NEEDED
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark

          plugin_skyline: yes
          plugin_skyline_year: 2026
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.8

      - name: GitHub achievements
        uses: lowlighter/metrics@latest
        with:
          filename: output/achievements.svg
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}
          base: ""
          config_timezone: Asia/Tokyo
          config_theme: github-dark
          config_display: large

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8
